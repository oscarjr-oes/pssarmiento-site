backend:
  name: github
  repo: oscarjr-oes/pssarmiento-site
  branch: main
  base_url: https://astounding-torrone-689f38.netlify.app
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "assets/news"
public_folder: "/assets/news"

site_url: https://pssarmiento.com
display_url: https://pssarmiento.com

collections:
  - name: "posts"
    label: "News Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "news/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["News & Events", "Foundation", "Projects", "Newsletter"]
        default: "News & Events"
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", required: true, hint: "1-2 sentences (max ~160 characters). Used as the search-result snippet and the Facebook/Viber link-preview text. See docs/NEWS-POSTING.md." }
      - { label: "Share Image", name: "image", widget: "image", required: false, hint: "Link-preview image. Ideal: 1200x630 JPG. Leave blank to use the PS Group default. Usually the same as Cover Image." }
      - { label: "Author", name: "author", widget: "string", default: "admin", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
